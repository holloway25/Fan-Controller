services:
  fan-controller:
    image: ghcr.io/holloway25/fan-controller:latest
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "8096:8096"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - fan-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  fan-data:
