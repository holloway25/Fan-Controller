name: privacy

# Fails if site detail reaches the repository. This is the backstop for
# .githooks/pre-commit, which is per-clone and therefore absent by
# default in a fresh clone and skippable with --no-verify.
#
# It scans the WHOLE TREE, not a diff, so it also catches anything that
# was committed before this workflow existed.
#
# NOTHING SITE-SPECIFIC IS WRITTEN HERE. A workflow file is public to
# anyone who can read the repo, so listing the real domain or VLAN
# numbering would publish exactly what the check protects. The rule is
# generic instead: NO private addressing at all. Documentation examples
# use the RFC5737 ranges reserved for the purpose.

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the per-commit scan below needs the commits
          # being pushed, not just the tip.
          fetch-depth: 0

      - name: No private address in ANY pushed commit
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # THE TREE SCAN BELOW IS NOT ENOUGH ON ITS OWN. A push where
          # commit A adds an address and commit B removes it passes a
          # tip-only check while A stays in the history forever - which
          # is precisely the failure that forced the 08-14 rewrite.
          # Found by review 2026-08-16.
          pat='(^|[^0-9.])(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})([^0-9.]|$)'
          base="$BASE"
          if [ -z "$base" ]; then base="$BEFORE"; fi
          # A new branch reports all-zeros for "before", and there is no
          # sensible base to diff against, so fall back to the tip alone.
          # The tree scan still covers it.
          case "$base" in
            ""|0000000000000000000000000000000000000000) range="$GITHUB_SHA" ;;
            *) git cat-file -e "$base^{commit}" 2>/dev/null \
                 && range="$base..$GITHUB_SHA" || range="$GITHUB_SHA" ;;
          esac
          # NOT --no-merges. A merge commit can introduce content of
          # its own through conflict resolution, and a review
          # reproduced exactly that: an address present only in a
          # merge, cleaned up afterwards, passed. Found 2026-08-16.
          bad=0
          for c in $(git rev-list "$range"); do
            if git grep -nE "$pat" "$c" -- . ':!.github/workflows/privacy.yml' ':!.githooks/pre-commit'; then
              echo "::error::Private address introduced in $c - it stays in history even if a later commit removes it."
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "no private addressing in any pushed commit"

      - name: No private (RFC1918) addresses
        run: |
          # 10/8, 172.16-31/12, 192.168/16. Loopback and 0.0.0.0 are
          # fine. Use 192.0.2.x, 198.51.100.x or 203.0.113.x in docs.
          if git grep -nE '(^|[^0-9.])(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})([^0-9.]|$)' -- . ':!.github/workflows/privacy.yml' ':!.githooks/pre-commit'; then
            echo "::error::A private address is in the tree. Documentation examples must use RFC5737 ranges (192.0.2.x)."
            exit 1
          fi
          echo "no private addressing"

      - name: No config file committed
        run: |
          # ANY DIRECTORY, not just the root: backup/config.json used
          # to pass both this and the hook. Found by review 2026-08-16.
          if git ls-files | grep -E '(^|/)config.*\.json' | grep -v '^config\.example\.json$'; then
            echo "::error::A config file is tracked. Only config.example.json may be."
            exit 1
          fi
          echo "no config file tracked"

      - name: No credential-looking values in the tree
        run: |
          # THE HOOK IS NOT A BACKSTOP. It is per-clone, absent in a
          # fresh clone until install.sh is run, and skippable with
          # --no-verify - so before this step a secret could be pushed
          # past a green CI. Found by review 2026-08-16.
          python3 tools/scan_secrets.py --tree

      - name: No credential-looking values in ANY pushed commit
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE"
          if [ -z "$base" ]; then base="$BEFORE"; fi
          case "$base" in
            ""|0000000000000000000000000000000000000000) range="$GITHUB_SHA" ;;
            *) git cat-file -e "$base^{commit}" 2>/dev/null \
                 && range="$base..$GITHUB_SHA" || range="$GITHUB_SHA" ;;
          esac
          bad=0
          for c in $(git rev-list "$range"); do
            python3 tools/scan_secrets.py --commit "$c" || bad=1
          done
          [ "$bad" -eq 0 ] || {
            echo "::error::A credential-looking value is in a pushed commit. It stays in history even if a later commit removes it."
            exit 1
          }
          echo "no credential-looking values in any pushed commit"

      - name: Hook is present and executable
        run: |
          test -x .githooks/pre-commit || { echo "::error::.githooks/pre-commit missing or not executable"; exit 1; }
          test -x .githooks/install.sh || { echo "::error::.githooks/install.sh missing or not executable"; exit 1; }
          test -f tools/scan_secrets.py || { echo "::error::tools/scan_secrets.py missing - the hook and this workflow both call it"; exit 1; }
          echo "hook present"
