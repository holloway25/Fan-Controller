name: tests

# Read-only, declared explicitly. This workflow checks out the repo and
# runs the suite; it writes nothing back. Both checkout and
# setup-python recommend narrowing the token to the smallest scope that
# works, and the default is wider than this needs.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: click, requests and urllib3 in
        # requirements.txt all declare requires-python >=3.10, so the
        # pinned set cannot install below it. The source itself parses
        # back to 3.9, which is not the same thing - which is why this
        # matrix is built from the dependencies rather than the syntax.
        #
        # 3.11 is Debian Bookworm, which is what a Raspberry Pi 3B+ runs.
        # 3.14 is what production runs today.
        python: ["3.10", "3.11", "3.14"]
    steps:
      # Node 20 was deprecated on the Actions runners. checkout v5 and
      # setup-python v6 are the first releases targeting Node 24
      # natively, which is the whole of what this bump is for. It
      # changed no behaviour: the green run BEFORE the bump was already
      # being force-run on Node 24, so the eventual removal of Node 20
      # takes away a runtime this workflow had already stopped using.
      #
      # NO DATES HERE, ON PURPOSE. An earlier version of this comment
      # pinned two of them and both were wrong within weeks - GitHub
      # moved the default-switch date and withdrew the removal date
      # altogether. Read the changelog for the current schedule:
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      #
      # v5 RATHER THAN v6 IS NOT A SAFETY CHOICE, whatever an earlier
      # version of this comment claimed. It said v6 alone changed
      # pull_request_target defaults and alone needed a newer runner.
      # Both were wrong. The pull_request_target enforcement was
      # backported to every supported major, and a floating tag like
      # @v5 picks it up automatically - so this workflow already has
      # it. The v2.329.0 runner floor is for authenticated git from a
      # Docker container action, which this does not do. v5 is here
      # because it works and is green; v6 and v7 exist and would also
      # work. Do not churn the version without a reason.
      #
      # @v5 and @v6 float, so they pick up backports - which is exactly
      # how the enforcement above arrived without anyone editing this
      # file. If a CI result ever needs to be reproducible, pin the full
      # commit SHA with the version in a trailing comment instead.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -r requirements.txt

      # The reason to run this on Linux at all: every test in
      # test_durability.py needs O_DIRECTORY and every test in
      # test_restart_sh.py needs bash, so both skip wholesale on a
      # Windows review host. This is the only place they run
      # automatically.
      #
      # Redirected rather than piped to tee. The default shell here is
      # `bash -e`, which does NOT set pipefail - so `python ... | tee`
      # reports tee's exit status and a failing suite would pass the
      # step. A green build that cannot go red is worse than no build.
      - name: run the suite
        run: |
          # set +e around the run, or `bash -e` aborts the moment the
          # suite exits non-zero and the cat below never happens - a red
          # build with nothing on screen to say what failed.
          set +e
          python tests/run_all.py > out.txt 2>&1
          status=$?
          set -e
          cat out.txt
          exit $status

      # A skip is not a pass. On Linux with bash present nothing should
      # skip, so treat one as a failure rather than letting the suite go
      # quietly green while covering less than it looks.
      - name: nothing should have skipped here
        if: always()
        run: |
          if [ ! -f out.txt ]; then
            echo "no output captured - the suite step did not get that far"
            exit 1
          fi
          if grep -q '^SKIP' out.txt; then
            echo "skipped on a platform where everything should run:"
            grep '^SKIP' out.txt
            exit 1
          fi
          echo "nothing skipped"
