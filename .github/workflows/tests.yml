name: tests

# Read-only, declared explicitly. This workflow checks out the repo and
# runs the suite; it writes nothing back. Both checkout and
# setup-python recommend narrowing the token to the smallest scope that
# works, and the default is wider than this needs.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: click, requests and urllib3 in
        # requirements.txt all declare requires-python >=3.10, so the
        # pinned set cannot install below it. The source itself parses
        # back to 3.9, which is not the same thing - which is why this
        # matrix is built from the dependencies rather than the syntax.
        #
        # 3.11 covers Debian Bookworm, which an older Pi image ships.
        # The MEASURED Pi runs Trixie with 3.13 - see Docs/arm.md - so
        # this row is compatibility cover, not a description of the
        # deployed board. Corrected 2026-08-16; it used to claim
        # Bookworm was what the 3B+ runs.
        # 3.14 is what production runs today.
        python: ["3.10", "3.11", "3.14"]
    steps:
      # Node 20 was deprecated on the Actions runners. checkout v5 and
      # setup-python v6 are the first releases targeting Node 24
      # natively, which is the whole of what this bump is for. It
      # changed no behaviour: the green run BEFORE the bump was already
      # being force-run on Node 24, so the eventual removal of Node 20
      # takes away a runtime this workflow had already stopped using.
      #
      # NO DATES HERE, ON PURPOSE. An earlier version of this comment
      # pinned two of them and both were wrong within weeks - GitHub
      # moved the default-switch date and withdrew the removal date
      # altogether. Read the changelog for the current schedule:
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      #
      # v5 RATHER THAN v6 IS NOT A SAFETY CHOICE, whatever an earlier
      # version of this comment claimed. It said v6 alone changed
      # pull_request_target defaults and alone needed a newer runner.
      # Both were wrong. The pull_request_target enforcement was
      # backported to every supported major, and a floating tag like
      # @v5 picks it up automatically - so this workflow already has
      # it. The v2.329.0 runner floor is for authenticated git from a
      # Docker container action, which this does not do. v5 is here
      # because it works and is green; v6 and v7 exist and would also
      # work. Do not churn the version without a reason.
      #
      # @v5 and @v6 float, so they pick up backports - which is exactly
      # how the enforcement above arrived without anyone editing this
      # file. If a CI result ever needs to be reproducible, pin the full
      # commit SHA with the version in a trailing comment instead.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -r requirements.txt

      # SHELLCHECK IS A PACKAGE, not a Python dependency, so
      # test_shellcheck.py SKIPS when it is absent - and the Pi does
      # not have it. Installed here so that skip never becomes the
      # normal case: the skip guard below then treats one as a failure,
      # which means the scripts really are checked on every push.
      #
      # bash -n catches a syntax error and nothing else. Every shell
      # bug this project has had parses perfectly: a pipeline hiding a
      # failing exit status, an unquoted expansion, and two variables
      # that outlived the code that used them - the last found by
      # shellcheck the day it was installed.
      - name: shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck

      # NODE IS A TEST DEPENDENCY, NEVER A RUNTIME ONE. The
      # controller needs Python and nothing else, and the Pi has
      # no Node at all - tests/test_js.py skips there. Installed
      # on every row here because each job fails on a SKIP, so
      # the skip cannot quietly become the normal case.
      #
      # jsdom runs the dashboard's own JavaScript against a
      # stubbed server. Everything else about the page is
      # asserted from its source, which catches a deletion and
      # not a mistake - and three regressions got past exactly
      # that.
      - name: node and jsdom
        run: npm ci

      # The reason to run this on Linux at all: every test in
      # test_durability.py needs O_DIRECTORY and every test in
      # test_restart_sh.py needs bash, so both skip wholesale on a
      # Windows review host. This is the only place they run
      # automatically.
      #
      # Redirected rather than piped to tee. The default shell here is
      # `bash -e`, which does NOT set pipefail - so `python ... | tee`
      # reports tee's exit status and a failing suite would pass the
      # step. A green build that cannot go red is worse than no build.
      - name: run the suite
        run: |
          # set +e around the run, or `bash -e` aborts the moment the
          # suite exits non-zero and the cat below never happens - a red
          # build with nothing on screen to say what failed.
          set +e
          # --all, ALWAYS. run_all.py defaults to the fast tier, which
          # leaves out test_js.py, test_install_sh.py and
          # test_restart_sh.py - together about four fifths of the
          # runtime. That default exists for iteration on a developer
          # machine. CI inheriting it would mean the three slowest and
          # least reproducible modules ran nowhere automatically, and
          # the build would stay green while covering less.
          python tests/run_all.py --all > out.txt 2>&1
          status=$?
          set -e
          cat out.txt
          exit $status

      # THE SUITE PASSING IS NOT EVIDENCE ON ITS OWN. Six external
      # reviews found the same defect over and over: tests asserting
      # the shape of the source rather than the behaviour of the
      # system, every one of them green. tools/mutate.py breaks a
      # curated set of specific things on purpose and requires the
      # named test to fail for each. --list says how many; a count in
      # a comment goes stale the moment one is added.
      #
      # ONE PYTHON ONLY. It copies the tree once per mutation and runs
      # a module in each, so it is minutes rather than seconds - across
      # the whole matrix that is time spent re-proving the same claims
      # on interpreters that cannot change the answer.
      #
      # It is not part of run_all.py deliberately: the suite runs on
      # the Pi, and this does far more work than that board should be
      # asked for on every change.
      - name: mutations must be caught
        if: matrix.python == '3.14'
        run: python tools/mutate.py

      # A skip is not a pass. On Linux with bash present nothing should
      # skip, so treat one as a failure rather than letting the suite go
      # quietly green while covering less than it looks.
      - name: nothing should have skipped here
        if: always()
        run: |
          if [ ! -f out.txt ]; then
            echo "no output captured - the suite step did not get that far"
            exit 1
          fi
          if grep -q '^SKIP' out.txt; then
            echo "skipped on a platform where everything should run:"
            grep '^SKIP' out.txt
            exit 1
          fi
          echo "nothing skipped"

  # ------------------------------------------------------------------
  # ARM64. The controller runs on a Raspberry Pi 3B+, and until now the
  # only thing that ever exercised that architecture was running the
  # suite on the board by hand.
  #
  # GitHub's arm64 standard runners were public-repository-only when
  # this was first raised, which is why it stayed open; they have been
  # supported in private repositories since January 2026 and are
  # free-tier eligible. Two vCPUs in a private repository, four in a
  # public one.
  #
  # WHAT THIS CATCHES: anything architecture-dependent. Struct sizes,
  # alignment, float formatting, wheel availability for arm64, a
  # dependency that only ships x86 binaries.
  #
  # WHAT IT DOES NOT CATCH, and the distinction matters because a green
  # tick here is easy to over-read: this is a Neoverse server with
  # several gigabytes of memory, not a 1.4GHz Cortex-A53 with 905MB.
  # Nothing about memory pressure, thermal limits or SD-card I/O is
  # tested here.
  #
  # THAT IS NOT A REASON TO RUN THE SUITE ON THE BOARD BY DEFAULT, which
  # is what this comment used to say. The Pi is the production
  # controller: it switches mains power, and the installer tests build
  # real virtual environments and run real pip installs on whatever
  # machine executes them. Run --all on the development VM or here.
  # Testing on the board is a DIAGNOSTIC step, not a deployment one.
  # Updating the Pi does not call for a suite run. Reach for it when
  # something is wrong there and the evidence has to come from that
  # hardware - and then run the part that answers the question.
  #
  # ONE PYTHON, matching what the Pi actually runs. The x86 matrix
  # above covers the version range; repeating it here would spend
  # minutes re-proving that Python is Python.
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Trixie on the deployed board ships 3.13. Docs/arm.md
          # records the exact version measured there.
          python-version: "3.13"

      - run: pip install -r requirements.txt

      # Needed here too: this job fails on a SKIP, and
      # test_shellcheck.py skips when the binary is absent.
      - name: shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck

      # Same reason. The runners ship Node, so this only fetches
      # the pinned jsdom.
      - name: jsdom
        run: npm ci

      - name: run the suite
        run: |
          set +e
          # --all, ALWAYS. run_all.py defaults to the fast tier, which
          # leaves out test_js.py, test_install_sh.py and
          # test_restart_sh.py - together about four fifths of the
          # runtime. That default exists for iteration on a developer
          # machine. CI inheriting it would mean the three slowest and
          # least reproducible modules ran nowhere automatically, and
          # the build would stay green while covering less.
          python tests/run_all.py --all > out.txt 2>&1
          status=$?
          set -e
          cat out.txt
          exit $status

      # Same rule as the x86 job: a skip here would mean something
      # silently did not run on the architecture this exists to cover,
      # which is worse than a failure because it looks green.
      - name: nothing should have skipped here
        if: always()
        run: |
          if [ ! -f out.txt ]; then
            echo "no output captured - the suite step did not get that far"
            exit 1
          fi
          if grep -q '^SKIP' out.txt; then
            echo "skipped on arm64, where everything should run:"
            grep '^SKIP' out.txt
            exit 1
          fi
          echo "nothing skipped"
