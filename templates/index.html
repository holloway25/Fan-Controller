<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Fan Controller</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Office Fan">
<meta name="theme-color" content="#0e1218">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1218;--panel:#161c26;--panel2:#1c2530;--line:#27313f;
--txt:#e8edf3;--dim:#aab6c6;--faint:#97a3b4;--ok:#34d399;--warn:#f87171;
--air:#4a9eff;--fan:#a78bfa;--trig:#f5a623;
--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
--sans:'Inter',system-ui,-apple-system,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);
-webkit-font-smoothing:antialiased;padding:16px;min-height:100vh;
background-image:radial-gradient(circle at 15% 0%,#16202c 0%,transparent 45%)}
.wrap{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grid{display:flex;flex-direction:column;gap:14px}
details.card{padding:0}
details.card>summary{list-style:none;cursor:pointer;padding:15px 18px;
display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.09em;
text-transform:uppercase;color:var(--faint);font-weight:600}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";margin-left:auto;font-size:17px;
color:var(--dim);font-weight:400;line-height:1}
details.card[open]>summary::after{content:"\2212"}
details.card>summary:hover{color:var(--txt)}
details.card>.body{padding:0 18px 16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:23px;font-weight:700;letter-spacing:-.01em;display:flex;
align-items:center;gap:9px}
h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
h1 .dot.live{background:var(--ok);box-shadow:0 0 10px var(--ok)}
h1 .dot.bad{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));
border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ctitle{font-size:12px;letter-spacing:.09em;text-transform:uppercase;
color:var(--faint);font-weight:600;margin-bottom:14px}
/* One spacing value for both rows, horizontal and vertical. */
.now{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Second row: environment readings, subordinate to the fan state above. */
.now.env{margin-top:10px}
.pill{font-family:var(--mono);font-size:13.5px;font-weight:500;padding:5px 11px;
border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.pill.on{background:rgba(52,211,153,.14);border-color:var(--ok);color:var(--ok)}
.pill.bad{background:rgba(248,113,113,.14);border-color:var(--warn);color:var(--warn)}
.pill.off{color:var(--faint)}
/* The rule currently demanding the fan. Matches the temperature trace. */
.pill.trig{background:rgba(245,166,35,.14);border-color:var(--trig);color:var(--trig)}
.sub{font-family:var(--mono);font-size:12.5px;color:var(--faint);margin-top:12px}
svg.trace{width:100%;height:auto;margin-top:14px;display:block}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;
padding:11px 0;border-bottom:1px solid rgba(39,49,63,.6)}
.row:last-of-type{border-bottom:0}
.row label{font-size:15px;color:var(--txt)}
.row .hint{display:block;font-size:12.5px;color:var(--faint);margin-top:3px;
line-height:1.45}
input[type=number],input[type=text],input[type=password],select{
font-family:var(--mono);font-size:14px;background:#0f1520;color:var(--txt);
border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:150px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--air);
outline-offset:1px}
select{width:220px}
button{font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;
background:#22303f;color:var(--txt);border:1px solid var(--line);
border-radius:8px;padding:9px 15px}
button:hover{background:#2a3a4c}
button.primary{background:var(--air);border-color:var(--air);color:#08121e;
font-weight:600}
button.primary:hover{filter:brightness(1.1)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;
overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 14px;background:transparent;
color:var(--dim)}
.seg button.sel{background:var(--air);color:#08121e;font-weight:600}
.actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.msg{font-family:var(--mono);font-size:13px;padding:10px 12px;border-radius:8px;
margin-top:12px;display:none;line-height:1.5}
.msg.err{display:block;background:rgba(248,113,113,.12);color:var(--warn);
border:1px solid rgba(248,113,113,.35)}
.msg.ok{display:block;background:rgba(52,211,153,.12);color:var(--ok);
border:1px solid rgba(52,211,153,.35)}
.lights{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lights label{font-size:13.5px;display:flex;align-items:center;gap:7px;
background:#0f1520;border:1px solid var(--line);border-radius:8px;
padding:8px 11px;cursor:pointer}
.log{font-family:var(--mono);font-size:13px;color:var(--dim);line-height:1.9}
.log div{display:flex;gap:10px;align-items:baseline}
.log span{flex:0 0 auto;white-space:nowrap;color:var(--faint)}
.log div.fault,.log div.fault span{color:var(--warn)}
.log div.ok,.log div.ok span{color:var(--ok)}
@media(max-width:640px){
header{flex-direction:column;align-items:stretch;gap:10px}
.seg{width:100%}
.seg button{flex:1 1 0;padding:11px 4px;text-align:center}
.row{grid-template-columns:1fr;gap:6px}
.row input,.row select{width:100%}
.row input[type=checkbox]{width:auto}
}
@media(max-width:520px){input,select{width:130px}}
</style></head><body><div class="wrap">

<header>
  <h1><span class="dot" id="dot"></span>Office Fan Controller</h1>
  <div class="seg" id="mode">
    <button data-mode="auto" title="Switch on the thresholds below">Auto</button>
    <button data-mode="manual" title="Switch off once, then leave the fan to the plug alone">Manual</button>
    <button data-mode="on">Force on</button>
  </div>
</header>

<div class="grid">
<div class="card" id="c-live">
  <div class="ctitle">Right now</div>
  <div class="now">
    <div class="pill off" id="fan">Fan unknown</div>
    <div class="pill" id="w">-- W</div>
    <div class="pill" id="minrun">Min run</div>
  </div>
  <div class="now env">
    <div class="pill" id="tc">--&deg;C</div>
    <div class="pill" id="ppm">-- ppm</div>
    <div class="pill" id="rh">--%</div>
    <div class="pill" id="pm">-- pm2.5</div>
  </div>
  <svg class="trace" id="trace" viewBox="0 0 700 216"></svg>
  <svg class="trace" id="trace2" viewBox="0 0 700 231"></svg>
  <div class="sub" id="sub">Waiting for a reading</div>
  <div class="msg" id="topmsg"></div>
</div>

<details class="card" id="c-activity" open>
  <summary>Activity</summary>
  <div class="body">
  <div class="log" id="log">Nothing yet.</div>
  </div>
</details>

<details class="card" id="c-thresholds">
  <summary>Thresholds</summary>
  <div class="body">
  <div class="row"><label>Turn the fan on above
    <span class="hint">Parts per million.</span></label>
    <input type="number" id="on_at" min="400" max="5000" step="25"></div>
  <div class="row"><label>Turn the fan off below
    <span class="hint">Keep a gap of at least 150 ppm below the on level so the fan does not short-cycle.</span></label>
    <input type="number" id="off_at" min="400" max="5000" step="25"></div>
  <div class="row"><label>Minimum run time
    <span class="hint">Once started, keep the fan on this long even if CO2 drops. Minutes.</span></label>
    <input type="number" id="min_run_minutes" min="0" max="120" step="1"></div>
  <div class="row"><label>Check every
    <span class="hint">Seconds between readings.</span></label>
    <input type="number" id="poll_seconds" min="5" max="600" step="5"></div>
  <div class="row"><label>Also run on temperature
    <span class="hint">Sheds heat with the fan before the AC needs to start.</span></label>
    <input type="checkbox" id="temp_enabled" style="width:auto"></div>
  <div class="row"><label>Turn the fan on above
    <span class="hint">Degrees C. Keep this well under your AC setpoint.</span></label>
    <input type="number" id="temp_on" min="10" max="40" step="0.5"></div>
  <div class="row"><label>Turn the fan off below
    <span class="hint">Degrees C.</span></label>
    <input type="number" id="temp_off" min="10" max="40" step="0.5"></div>
  <div class="row"><label>Ventilate if readings stop
    <span class="hint">Minutes without a valid reading before the fan is turned on as a fail-safe. 0 disables it.</span></label>
    <input type="number" id="stale_minutes" min="0" max="1440" step="5"></div>
  <div class="actions"><button class="primary" id="save">Save settings</button></div>
  <div class="msg" id="savemsg"></div>
  </div>
</details>

<details class="card" id="c-sensor">
  <summary>Air quality sensor</summary>
  <div class="body">
  <div class="row"><label>UniFi console</label>
    <input type="text" id="p_host"></div>
  <div class="row"><label>Verify certificate
    <span class="hint">Only works when the console address is a hostname the certificate covers, not an IP.</span></label>
    <input type="checkbox" id="p_verify" style="width:auto"></div>
  <div class="row"><label>Local username
    <span class="hint">A local UniFi account without two-factor. Not a UI Cloud login.</span></label>
    <input type="text" id="p_user" autocomplete="off"></div>
  <div class="row"><label>Password</label>
    <input type="password" id="p_pass" autocomplete="new-password"></div>
  <div class="row"><label>Sensor</label>
    <select id="p_sensor"><option value="">Not selected</option></select></div>
  <div class="actions"><button id="find">Find sensors</button>
    <button id="save2">Save</button>
    <a href="/api/debug/sensor" target="_blank" style="color:var(--faint);font-size:12px">Debug payload</a></div>
  <div class="msg" id="pmsg"></div>
  </div>
</details>

<details class="card" id="c-plug">
  <summary>Fan plug</summary>
  <div class="body">
  <div class="row"><label>Plug address
    <span class="hint">Tasmota device running the fan.</span></label>
    <input type="text" id="g_host"></div>
  <div class="row"><label>Username
    <span class="hint">Tasmota web user, usually admin.</span></label>
    <input type="text" id="g_user" autocomplete="off"></div>
  <div class="row"><label>Password
    <span class="hint">Blank if no web password is set on the plug.</span></label>
    <input type="password" id="g_pass" autocomplete="new-password"></div>
  <div class="row"><label>Power monitoring
    <span class="hint">Watch the draw while the fan runs. Off means the wattage is shown but never acted on.</span></label>
    <input type="checkbox" id="watts_enabled" style="width:auto"></div>
  <div class="row"><label>Expected draw, low
    <span class="hint">Watts. Below this while running is a fault: the relay closed but the fan is not pulling what it should.</span></label>
    <input type="number" id="watts_min" min="1" max="5000" step="0.5"></div>
  <div class="row"><label>Expected draw, high
    <span class="hint">Watts. A two-speed fan needs this above its high-speed draw, or normal running reads as a fault.</span></label>
    <input type="number" id="watts_max" min="1" max="5000" step="0.5"></div>
  <div class="row"><label>Fault after
    <span class="hint">Seconds outside the band before the fan is stopped and a fault raised. Force on overrides a fault.</span></label>
    <input type="number" id="watts_fault_seconds" min="5" max="3600" step="5"></div>
  <div class="actions"><button id="plugtest">Test plug</button>
    <button id="faultclear">Clear fault</button>
    <button id="save3">Save</button></div>
  <div class="msg" id="hmsg"></div>
  </div>
</details>
</div>
</div>
<script>
// Report script failures to the server; a load-time error is otherwise
// invisible because the page simply stops updating.
function _report(msg,src,line){
  try{fetch("/api/clienterror",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({msg:String(msg),src:String(src||""),line:line||0})})}
  catch(e){}
}
window.addEventListener("error",e=>_report(
  e.message||e.error,e.filename,e.lineno));
window.addEventListener("unhandledrejection",e=>_report(
  "unhandled promise: "+(e.reason&&e.reason.message||e.reason),"",0));
const $=id=>document.getElementById(id);
let CFG=null, touched=false;
const dirty=()=>{touched=true};

function say(el,text,kind){const n=$(el);n.textContent=text||"";
  n.className="msg"+(text?" "+kind:"")}

async function post(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
  if(r.status===401){
    // fetch() will not raise the Basic auth dialog; a navigation does.
    try{window.open("/signin","_blank")}catch(e){}
    throw new Error("Sign in required. Authenticate in the tab that just "+
                    "opened, then try again.");
  }
  const j=await r.json().catch(()=>({error:"Bad reply from server"}));
  if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
  return j;
}

function fmtAgo(t){if(!t)return"never";
  const s=Math.round(Date.now()/1000-t);
  if(s<60)return s+"s ago"; if(s<3600)return Math.round(s/60)+"m ago";
  return Math.round(s/3600)+"h ago"}

// Below this the fan is not turning, whatever band the user configured.
// Shared so the no-draw warning and the draw pill cannot drift apart and
// disagree with each other on screen.
const NO_DRAW_W=1;
// The plug reports whole watts, so a fixed decimal would be false
// precision. Round to one place and let a trailing .0 fall away.
const fmtW=v=>String(Math.round(v*10)/10);

// A countdown rather than a timestamp. The UI polls every 5s but the
// sensor is read every poll_seconds, so this needs its own 1s timer or it
// would jump in 5s steps. Derived from poll_seconds, not a fixed 30, so it
// stays honest if the interval is changed.
let SUB={read:null,poll:30,changed:null,hold:null,mins:""};
// Seconds as m/s: a bare 365 reads as a timestamp at a glance.
const fmtDur=n=>n>=60?(Math.floor(n/60)+"m "+(n%60)+"s"):(n+"s");
function paintHold(){
  // Only meaningful while nothing is demanding the fan: with a latch set
  // it runs because it should, not because it must.
  const mp=$("minrun");
  const n=SUB.hold?Math.ceil(SUB.hold-Date.now()/1000):0;
  // Always present so the lease is discoverable before it is holding
  // anything: green while it counts down, neutral showing its length
  // otherwise.
  mp.textContent=n>0?("Min run "+fmtDur(n)):("Min run "+SUB.mins);
  mp.className="pill"+(n>0?" on":"");
}
function paintSub(){
  paintHold();
  if(!SUB.read){$("sub").textContent="Waiting for a reading";return}
  const left=Math.ceil(SUB.read+SUB.poll-Date.now()/1000);
  // A read that is overdue must not show a negative or stuck countdown.
  let t=left>0?"Refresh in "+left+"s":"Refresh due";
  if(SUB.changed)t+=" \u00b7 last switched "+fmtAgo(SUB.changed);
  $("sub").textContent=t;
}
setInterval(paintSub,1000);

function drawTrace(hist,on_at,off_at){
  const svg=$("trace");
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  if(!hist||hist.length<2)return;
  const NS="http://www.w3.org/2000/svg";
  // Derive geometry from the viewBox so the card can be resized.
  const vb=svg.viewBox.baseVal,W=vb.width||700,H=vb.height||140;
  // Time axis lives under the mini charts now, so only a small bottom
  // margin is reserved here rather than a full label strip.
  const L=46,TOP=10,BOT=H-6;
  const mk=(n,a)=>{const e=document.createElementNS(NS,n);
    for(const k in a)e.setAttribute(k,a[k]);return e};
  const txt=(s,a)=>{const e=mk("text",a);e.textContent=s;return e};
  const vs=hist.map(p=>p.v);
  const lo=Math.min(...vs,off_at)-40, hi=Math.max(...vs,on_at)+40;
  const t0=hist[0].t, t1=hist[hist.length-1].t;
  const span=Math.max(1,t1-t0);
  const y=v=>TOP+(1-(v-lo)/(hi-lo))*(BOT-TOP);
  const x=t=>L+((t-t0)/span)*(W-L);
  svg.appendChild(mk("rect",{x:L,width:W-L,y:y(on_at),
    height:Math.max(0,y(off_at)-y(on_at)),fill:"rgba(167,139,250,.10)"}));
  [[on_at,"#a78bfa","fan on"],[off_at,"#4a9eff","fan off"]]
    .forEach(([v,c,tag])=>{
    svg.appendChild(mk("line",{x1:L,x2:W,y1:y(v),y2:y(v),stroke:c,
      "stroke-width":1,"stroke-dasharray":"4 4",opacity:.85}));
    svg.appendChild(txt(Math.round(v),{x:L-7,y:y(v)+5,fill:c,
      "font-size":13,"text-anchor":"end",
       "font-family":"ui-monospace,monospace"}));
    svg.appendChild(txt(tag,{x:W-2,y:y(v)-5,fill:c,"font-size":11,
      "text-anchor":"end",opacity:.9,
      "font-family":"ui-monospace,monospace"}))});
  svg.appendChild(mk("polyline",{
    points:hist.map(p=>x(p.t)+","+y(p.v)).join(" "),
    fill:"none",stroke:"#e8edf3","stroke-width":1.6,
    "stroke-linejoin":"round","stroke-linecap":"round"}));
  // Current reading in the gutter, as the mini rows show theirs. Nudged
  // clear of the threshold labels, which share the gutter - CO2 sits on a
  // threshold exactly when you are most likely to be watching it.
  const last=vs[vs.length-1];
  let ly=y(last)+5;
  [y(on_at)+5,y(off_at)+5].forEach(ty=>{
    if(Math.abs(ly-ty)<14)ly=ly<ty?ty-14:ty+14});
  svg.appendChild(txt(Math.round(last),{x:L-7,y:ly,fill:"#e8edf3",
    "font-size":13,"font-weight":600,"text-anchor":"end",
    "font-family":"ui-monospace,monospace"}));
  svg.appendChild(txt("CO2 ppm",{x:L+4,y:TOP+11,fill:"#97a3b4",
    "font-size":12,opacity:.85,
    "font-family":"ui-monospace,monospace"}));
}

function drawMini(hist,c){
  const svg=$("trace2");
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  if(!hist||hist.length<2)return;
  const NS="http://www.w3.org/2000/svg";
  const vb=svg.viewBox.baseVal,W=vb.width||700,H=vb.height||140;
  const L=46;
  const mk=(n,a)=>{const e=document.createElementNS(NS,n);
    for(const k in a)e.setAttribute(k,a[k]);return e};
  const txt=(s,a)=>{const e=mk("text",a);e.textContent=s;return e};
  const t0=hist[0].t,t1=hist[hist.length-1].t,span=Math.max(1,t1-t0);
  const x=t=>L+((t-t0)/span)*(W-L);
  const MONO="ui-monospace,monospace";
  // Each metric keeps its own scale; degrees, percent and ug/m3 do not
  // share an axis. Units live in the name, not the gutter value, so the
  // gutter text cannot outgrow its 46px column.
  const defs=[["tc","#f5a623","Temperature \u00b0C"],
              ["rh","#34d399","Humidity %"],
              ["pm","#4a9eff","PM2.5 \u00b5g/m\u00b3"]];
  // AXIS reserves the strip the shared time labels sit in, so row heights
  // stay what they were when the axis lived under the CO2 chart.
  const AXIS=26,GAP=10;
  const BH=(H-AXIS-GAP*(defs.length-1))/defs.length;
  const rows=defs.map((d,i)=>d.concat([i*(BH+GAP),i*(BH+GAP)+BH]));
  rows.forEach(([key,col,name,top,bot])=>{
    const pts=hist.filter(p=>p[key]!=null);
    // Thresholds exist only for temperature, and only while it drives
    // the fan. Disabled triggers must not imply the fan reacts to them.
    const thr=(key==="tc"&&c&&c.temp_enabled&&c.temp_on!=null
      &&c.temp_off!=null)?[c.temp_on,c.temp_off]:null;
    const nameEl=txt(name,{x:L+4,y:top+11,fill:col,"font-size":12,
      opacity:.85,"font-family":MONO});
    svg.appendChild(nameEl);
    if(pts.length<2){
      svg.appendChild(txt("no data yet",{x:W,y:top+11,fill:"#97a3b4",
        "font-size":11,"text-anchor":"end","font-family":MONO}));
      return}
    const vs=pts.map(p=>p[key]);
    let lo=Math.min(...vs),hi=Math.max(...vs);
    // Keep the lines on screen even if the room never reaches them.
    if(thr){lo=Math.min(lo,...thr);hi=Math.max(hi,...thr)}
    if(hi-lo<0.5){lo-=0.5;hi+=0.5}
    const y=v=>top+17+(1-(v-lo)/(hi-lo))*(bot-top-17);
    if(thr){
      const yon=y(thr[0]),yoff=y(thr[1]);
      svg.appendChild(mk("rect",{x:L,width:W-L,y:yon,
        height:Math.max(0,yoff-yon),fill:"rgba(167,139,250,.10)"}));
      // Tag above the on line and below the off line. On a 45px row the
      // two are often ~7px apart, so same-side tags would overlap.
      [[thr[0],"#a78bfa","fan on",-4],[thr[1],"#4a9eff","fan off",11]]
        .forEach(([v,lcol,tag,dy])=>{
        svg.appendChild(mk("line",{x1:L,x2:W,y1:y(v),y2:y(v),stroke:lcol,
          "stroke-width":1,"stroke-dasharray":"4 4",opacity:.85}));
        svg.appendChild(txt(tag,{x:W-2,y:y(v)+dy,fill:lcol,"font-size":11,
          "text-anchor":"end",opacity:.9,"font-family":MONO}))});
    }
    svg.appendChild(mk("polyline",{
      points:pts.map(p=>x(p.t)+","+y(p[key])).join(" "),
      fill:"none",stroke:col,"stroke-width":1.4,
      "stroke-linejoin":"round","stroke-linecap":"round"}));
    svg.appendChild(txt(vs[vs.length-1].toFixed(1),
      {x:L-7,y:(top+bot)/2+7,fill:col,"font-size":13,"text-anchor":"end",
       "font-family":MONO}));
    // The fan tags own the right edge on this row, so the range follows
    // the row name instead. Measured rather than estimated, so a longer
    // label can never overlap it.
    let rx=W,anc="end";
    if(thr){let nw=100;
      try{nw=nameEl.getComputedTextLength()}catch(e){}
      rx=L+4+nw+12;anc="start"}
    svg.appendChild(txt(lo.toFixed(1)+"\u2013"+hi.toFixed(1),
      {x:rx,y:top+11,fill:"#97a3b4","font-size":11,"text-anchor":anc,
       "font-family":MONO}))});
  // Shared time axis for both charts: they plot the same window, so one
  // set of labels at the very bottom serves the CO2 trace above too.
  const hm=t=>{const d=new Date(t*1000),z=n=>String(n).padStart(2,"0");
    return z(d.getHours())+":"+z(d.getMinutes())};
  const cap={fill:"#97a3b4","font-size":12,"font-family":MONO};
  const mins=Math.round(span/60);
  svg.appendChild(txt(hm(t0),Object.assign({x:L,y:H-6},cap)));
  svg.appendChild(txt(mins>=120?Math.round(mins/60)+"h span":mins+"m span",
    Object.assign({x:(L+W)/2,y:H-6,"text-anchor":"middle"},cap)));
  svg.appendChild(txt(hm(t1),Object.assign({x:W,y:H-6,
    "text-anchor":"end"},cap)));
}

function render(s){
  const c=s.config.control;
  $("ppm").textContent=(s.co2==null?"--":Math.round(s.co2))+" ppm";
  const f=$("fan");
  // Relay closed but drawing nothing means the fan is not really running.
  // Grace period: the meter lags a switch by a few seconds, so flagging
  // immediately would false-alarm on every start.
  // Absent changed_at means the fan was already running at startup, so it
  // is certainly settled; requiring the timestamp meant a relay left on
  // through a restart could never be flagged.
  const settled=!s.changed_at || (Date.now()/1000-s.changed_at)>20;
  const dead=s.fan===true && settled && s.watts!=null && s.watts<NO_DRAW_W;
  // A fault outranks the normal labels either way: off because it was
  // stopped, or on because Force on is overriding it. Both are red.
  const flt=!!s.fault;
  f.textContent=s.fan==null?"Fan unknown":
    (s.fan?(flt?"Fan on - Fault":(dead?"Fan on, no draw":"Fan running"))
          :(flt?"Fan off - Fault":"Fan off"));
  f.className="pill "+((dead||flt)?"bad":(s.fan?"on":"off"));
  $("dot").className="dot "+(s.error?"bad":(s.co2!=null?"live":""));
  // An unconfirmed stop is the worse case: faulted but possibly still
  // running, and the plug is not answering to say either way.
  const fmsg=s.fault?(s.fault.msg+(s.fault.stopped?"":
    " — stop unconfirmed, retrying")):"";
  say("topmsg",fmsg||s.error||"", "err");
  // Held on by the minimum-run lease rather than by demand: fan running,
  // neither rule latched, and the lease not yet expired. decide() returns
  // None in exactly this case, which is otherwise invisible.
  const mr=(+c.min_run_minutes||0)*60;
  // Auto only: in Force on the latches are also clear, but the mode is
  // what holds the fan, not the lease.
  const idle=s.fan===true&&c.mode==="auto"&&!s.latch.co2&&!s.latch.temp;
  SUB={read:s.reading_at,poll:Number(c.poll_seconds)||30,
       changed:s.changed_at, mins:(+c.min_run_minutes||0)+"m",
       hold:(idle&&mr>0&&s.changed_at)?s.changed_at+mr:null};
  paintSub();
  // History is fetched separately and only when it actually changed:
  // it is ~99% of the old /api/state payload but only moves once per poll.
  if(s.history_rev!==HIST_REV&&!HIST_BUSY){
    HIST_BUSY=true;
    fetch("/api/history").then(r=>r.json()).then(h=>{
      HIST=h.history||[];
      // Store the revision the response carried, not the one we saw, or a
      // change landing mid-flight would be missed until the next one.
      HIST_REV=h.history_rev; HIST_BUSY=false;
      drawTrace(HIST,c.on_at,c.off_at); drawMini(HIST,c);
    }).catch(()=>{HIST_BUSY=false});
  }
  drawTrace(HIST,c.on_at,c.off_at);
  drawMini(HIST,c);
  $("tc").textContent=s.temperature==null?"--\u00b0C":s.temperature.toFixed(1)+"\u00b0C";
  // Green means monitored and behaving, amber means it is the rule
  // currently demanding the fan. Humidity and PM2.5 stay neutral: they
  // are shown, not acted on. Temperature is only monitored when enabled.
  const auto=c.mode==="auto";
  $("ppm").className="pill"+(auto&&s.latch.co2?" trig":" on");
  $("tc").className="pill"+(c.temp_enabled?
    (auto&&s.latch.temp?" trig":" on"):"");
  $("rh").textContent=s.humidity==null?"--%":s.humidity.toFixed(1)+"%";
  $("pm").textContent=s.pm25==null?"-- pm2.5":s.pm25.toFixed(1)+" pm2.5";
  $("w").textContent=s.watts==null?"-- W":fmtW(s.watts)+" W";
  // Draw is only meaningful while the fan is meant to be running, and only
  // once settled: a motor spinning up would otherwise flash red every start.
  // No reading at all counts as bad, since a dead plug is exactly the case
  // this is here to catch.
  let wcls="pill";
  if(s.fan===true&&settled){
    const pg=s.config.plug;
    const ok=s.watts!=null&&s.watts>=NO_DRAW_W
      &&s.watts>=pg.watts_min&&s.watts<=pg.watts_max;
    wcls="pill "+(ok?"on":"bad");
  }
  $("w").className=wcls;
  document.querySelectorAll("#mode button").forEach(b=>
    b.classList.toggle("sel",b.dataset.mode===c.mode));
  // Built as DOM nodes with textContent: event text can originate from
  // /api/clienterror, so interpolating it into innerHTML was a stored XSS.
  const logEl=$("log");
  logEl.textContent="";
  if(s.events&&s.events.length){
    s.events.forEach(e=>{
      const row=document.createElement("div");
      const when=document.createElement("span");
      const d=new Date(e.at*1000), p=n=>String(n).padStart(2,"0");
      // Explicit 24-hour formatting; toLocaleTimeString adds am/pm here.
      when.textContent=p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+
        d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+
        p(d.getSeconds());
      // Every fault-related entry is red, including "Fan off - draw
      // fault", which a prefix match on the raised message missed. Fan
      // state changes are green once they are not a fault.
      const m=typeof e.msg==="string"?e.msg:"";
      // Anchored, not a bare substring: "Changed: watts_fault_seconds"
      // contains the word but is a settings edit, not a fault.
      if(/^Draw fault/i.test(m)||/draw fault$/i.test(m))
        row.className="fault";
      else if(/^Fan /.test(m))row.className="ok";
      row.appendChild(when);
      row.appendChild(document.createTextNode(e.msg==null?"":String(e.msg)));
      logEl.appendChild(row)});
  }else{logEl.textContent="Nothing yet."}
  if(touched)return;
  CFG=s.config;
  ["on_at","off_at","min_run_minutes","poll_seconds","temp_on","temp_off",
   "stale_minutes"]
    .forEach(k=>$(k).value=c[k]);
  $("temp_enabled").checked=!!c.temp_enabled;
  $("p_host").value=s.config.protect.host;
  $("p_verify").checked=!!s.config.protect.verify_tls;
  $("p_user").value=s.config.protect.username;
  if(s.config.protect.password==="SET"&&!$("p_pass").value)$("p_pass").placeholder="unchanged";
  $("g_host").value=s.config.plug.host;
  $("g_user").value=s.config.plug.user;
  $("watts_enabled").checked=!!s.config.plug.watts_enabled;
  $("watts_fault_seconds").value=s.config.plug.watts_fault_seconds;
  $("watts_min").value=s.config.plug.watts_min;
  $("watts_max").value=s.config.plug.watts_max;
  if(s.config.plug.password==="SET"&&!$("g_pass").value)$("g_pass").placeholder="unchanged";
}

// Checkboxes and selects fire "change", not "input". Listening for both
// stops the 5s refresh from overwriting a control the user just touched.
["on_at","off_at","min_run_minutes","poll_seconds","p_host",
 "p_user","p_pass","g_host","g_user","g_pass","p_sensor","temp_enabled","temp_on","temp_off","p_verify","stale_minutes","watts_min","watts_max","watts_enabled","watts_fault_seconds"].forEach(id=>{
  $(id).addEventListener("input",dirty);
  $(id).addEventListener("change",dirty);});
// Light checkboxes are created after load, so delegate.
document.addEventListener("change",e=>{
  if(e.target&&e.target.closest&&e.target.closest(".lights"))dirty();});

async function saveAll(msgEl){
  const body={control:{
      on_at:+$("on_at").value, off_at:+$("off_at").value,
      min_run_minutes:+$("min_run_minutes").value,
      poll_seconds:+$("poll_seconds").value,
      temp_enabled:$("temp_enabled").checked,
      temp_on:+$("temp_on").value, temp_off:+$("temp_off").value,
      stale_minutes:+$("stale_minutes").value},
    protect:{host:$("p_host").value.trim(),
      username:$("p_user").value.trim(),
      verify_tls:$("p_verify").checked},
    plug:{host:$("g_host").value.trim(),
      user:$("g_user").value.trim(),
      watts_enabled:$("watts_enabled").checked,
      watts_fault_seconds:+$("watts_fault_seconds").value,
      watts_min:+$("watts_min").value,
      watts_max:+$("watts_max").value}};
  if($("g_pass").value)body.plug.password=$("g_pass").value;
  if($("p_pass").value)body.protect.password=$("p_pass").value;
  // Only send a selection when the picker is actually populated, so a
  // save from a freshly loaded page cannot wipe a stored choice.
  const sid=$("p_sensor").value;
  if(sid||!(CFG&&CFG.protect.sensor_id))body.protect.sensor_id=sid;
  const j=await post("/api/config",body);
  touched=false;
  // A cleared secret is reported so the change is never silent.
  say(msgEl, j.notice || "Saved.", j.notice ? "err" : "ok");
}

[["save","savemsg"],["save2","pmsg"],["save3","hmsg"]].forEach(([b,m])=>
  $(b).addEventListener("click",async()=>{
    try{await saveAll(m)}catch(e){say(m,e.message,"err")}}));

document.querySelectorAll("#mode button").forEach(b=>
  b.addEventListener("click",async()=>{
    try{await post("/api/config",{control:{mode:b.dataset.mode}});
        say("topmsg","","")}
    catch(e){say("topmsg",e.message,"err")}
    tickUI()}));

async function loadSensors(msgEl){
  const j=await post("/api/protect/sensors");
  const sel=$("p_sensor"), cur=CFG?CFG.protect.sensor_id:"";
  sel.innerHTML='<option value="">Not selected</option>';
  j.sensors.forEach(s=>{
    const o=document.createElement("option");
    o.value=s.id;
    o.textContent=s.name+(s.co2!=null
      ? "  \u2014 "+Math.round(s.co2)+" ppm" : "  \u2014 no CO2 field");
    if(s.id===cur)o.selected=true;
    sel.appendChild(o)});
  if(msgEl){
    const n=j.sensors.filter(s=>s.co2!=null).length;
    say(msgEl,j.sensors.length+" sensor(s) found, "+n+" reporting CO2."+
      (n?" Pick one and save.":" Open the debug view to see the payload."),
      n?"ok":"err")}
}

$("find").addEventListener("click",async()=>{
  say("pmsg","Connecting...","ok");
  try{await saveAll("pmsg"); await loadSensors("pmsg")}
  catch(e){say("pmsg",e.message,"err")}
});


// A fault is the one thing that stops the fan running on its own, so it
// is surfaced at the top rather than buried in the plug card.
$("faultclear").addEventListener("click",async()=>{
  try{await post("/api/fault/clear",{}); say("hmsg","Fault cleared","ok")}
  catch(e){say("hmsg",e.message,"err")}});
$("plugtest").addEventListener("click",async()=>{
  say("hmsg","Testing...","ok");
  try{
    await saveAll("hmsg");
    const j=await post("/api/plug/test");
    const w=(j.watts==null)?"no reading":(j.watts.toFixed(1)+" W");
    say("hmsg","Plug responded. Relay is "+(j.on?"ON":"off")+
        ", drawing "+w+".","ok");
  }catch(e){say("hmsg",e.message,"err")}
});

let HIST=[], HIST_REV=null, HIST_BUSY=false;
let hydrated=false;
async function hydrate(){
  if(CFG&&CFG.protect.username){
    try{await loadSensors(null)}catch(e){say("pmsg",e.message,"err")}}
}

// Remember which sections were left open, per browser.
document.querySelectorAll("details.card").forEach(d=>{
  const k="co2fan.open."+d.id;
  try{const v=localStorage.getItem(k); if(v!==null)d.open=(v==="1")}catch(e){}
  d.addEventListener("toggle",()=>{
    try{localStorage.setItem(k,d.open?"1":"0")}catch(e){}});
});

async function tickUI(){
  try{const r=await fetch("/api/state"); render(await r.json());
      if(!hydrated&&CFG){hydrated=true; hydrate()}}
  catch(e){$("dot").className="dot bad"}
}
tickUI();
setInterval(tickUI,5000);
</script></body></html>
